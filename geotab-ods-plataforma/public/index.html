<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Integral ODS & KPIs Geotab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

    <!-- LOGIN INICIAL -->
    <div id="loginSection" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow mt-16">
        <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">Acceso - Flotas Geotab</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Usuario</label>
                <input type="text" id="usuario" required class="w-full border rounded p-2" placeholder="cesar.admin o tecnico.campo">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Contraseña</label>
                <input type="password" id="password" required class="w-full border rounded p-2">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">Ingresar</button>
        </form>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="appSection" class="max-w-5xl mx-auto space-y-8 hidden">
        
        <!-- ENCABEZADO -->
        <div class="bg-white p-6 rounded-lg shadow flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Administración de Flotas - Geotab & AT&T</h1>
                <p class="text-sm text-gray-500" id="rolUsuarioLogueado">Rol: --</p>
            </div>
            <button onclick="cerrarSesion()" class="bg-red-500 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-red-600">Cerrar Sesión</button>
        </div>

        <!-- DASHBOARD DE KPIS Y GESTIÓN DE USUARIOS (Visible solo para Admins) -->
        <div id="dashboardAdmin" class="space-y-6 hidden">
            <!-- Tarjetas de KPIs -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                    <p class="text-gray-500 text-sm">Total Servicios</p>
                    <h3 class="text-2xl font-bold text-gray-800" id="kpiTotal">--</h3>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
                    <p class="text-gray-500 text-sm">Salud Óptima (GPS)</p>
                    <h3 class="text-2xl font-bold text-gray-800" id="kpiSalud">--%</h3>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500">
                    <p class="text-gray-500 text-sm">En Revisión</p>
                    <h3 class="text-2xl font-bold text-gray-800" id="kpiRevision">--</h3>
                </div>
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-red-500">
                    <p class="text-gray-500 text-sm">Unidades Ciegas</p>
                    <h3 class="text-2xl font-bold text-gray-800" id="kpiCiegas">0</h3>
                </div>
            </div>

            <!-- PANEL PARA CREAR NUEVOS USUARIOS -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2">Registrar Nuevo Usuario / Técnico</h3>
                <form id="crearUsuarioForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <div>
                        <label class="block text-xs font-semibold mb-1">Nombre de Usuario</label>
                        <input type="text" id="nuevoUsuario" required class="w-full border rounded p-2 text-sm" placeholder="ej. tecnico.carlos">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">Contraseña</label>
                        <input type="password" id="nuevaPassword" required class="w-full border rounded p-2 text-sm" placeholder="Contraseña">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">Rol</label>
                        <select id="nuevoRol" class="w-full border rounded p-2 text-sm bg-white">
                            <option value="tecnico">Técnico en Campo</option>
                            <option value="admin">Administrador / Coordinador</option>
                        </select>
                    </div>
                    <button type="submit" class="bg-green-600 text-white font-bold py-2 px-4 rounded text-sm hover:bg-green-700 transition">
                        Crear Usuario
                    </button>
                </form>
                <div id="resultadoUsuario" class="mt-2 text-sm font-semibold"></div>
            </div>
        </div>

        <!-- FORMULARIO DE ODS Y FOTOS -->
        <div class="bg-white p-6 md:p-8 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Orden de Servicio - Captura en Campo</h2>
            
            <form id="odsForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-sm mb-1">Folio de Acuerdo *</label>
                        <input type="text" id="folioAcuerdo" required class="w-full border rounded p-2" placeholder="Ej. 3873031757-3">
                    </div>
                    <div>
                        <label class="block font-semibold text-sm mb-1">Número de Serie GO9 *</label>
                        <input type="text" id="serialGo9" required class="w-full border rounded p-2" placeholder="Ej. G9-5NK-M87">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block font-semibold text-sm mb-1">IMEI Cámara</label>
                        <input type="text" id="imeiCamara" class="w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block font-semibold text-sm mb-1">Número de SIM</label>
                        <input type="text" id="numeroSim" class="w-full border rounded p-2">
                    </div>
                    <div>
                        <label class="block font-semibold text-sm mb-1">VIN del Vehículo</label>
                        <input type="text" id="vinVehiculo" class="w-full border rounded p-2">
                    </div>
                </div>

                <!-- EVIDENCIAS FOTOGRÁFICAS -->
                <div class="bg-gray-50 p-4 rounded border">
                    <h3 class="font-semibold text-sm text-gray-700 mb-2">Evidencias Fotográficas Obligatorias:</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                        <div><label>Adhesivo GO9:</label><input type="file" id="foto_adherible" accept="image/*" capture="environment" class="w-full mt-1"></div>
                        <div><label>IMEI/SIM Cámara:</label><input type="file" id="foto_imei_camara" accept="image/*" capture="environment" class="w-full mt-1"></div>
                        <div><label>VIN Vehículo:</label><input type="file" id="foto_vin" accept="image/*" capture="environment" class="w-full mt-1"></div>
                        <div><label>Tablero:</label><input type="file" id="foto_tablero" accept="image/*" capture="environment" class="w-full mt-1"></div>
                        <div><label>Arnés 16 Pines:</label><input type="file" id="foto_arnes" accept="image/*" capture="environment" class="w-full mt-1"></div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition">
                    Generar ODS en Word y Actualizar Sistema
                </button>
            </form>

            <div id="resultado" class="mt-4 p-4 rounded hidden"></div>
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const rol = localStorage.getItem('rol');
            if (token) mostrarApp(rol);
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });
            const data = await res.json();

            if (data.exito) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('rol', data.rol);
                mostrarApp(data.rol);
            } else {
                alert(data.error);
            }
        });

        function mostrarApp(rol) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('rolUsuarioLogueado').innerText = `Rol activo: ${rol.toUpperCase()}`;

            if (rol === 'admin') {
                document.getElementById('dashboardAdmin').style.display = 'block';
                cargarKPIs(localStorage.getItem('token'));
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            location.reload();
        }

        async function cargarKPIs(token) {
            try {
                const res = await fetch('/api/kpis', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('kpiTotal').innerText = data.totalInstalaciones;
                    document.getElementById('kpiSalud').innerText = data.saludOptimaPct + '%';
                    document.getElementById('kpiRevision').innerText = data.enRevision;
                    document.getElementById('kpiCiegas').innerText = data.ciegas;
                }
            } catch (e) { console.error(e); }
        }

        // Crear Usuario desde el panel
        document.getElementById('crearUsuarioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevoUsuario = document.getElementById('nuevoUsuario').value;
            const nuevaPassword = document.getElementById('nuevaPassword').value;
            const rol = document.getElementById('nuevoRol').value;
            const resDiv = document.getElementById('resultadoUsuario');

            try {
                const res = await fetch('/api/usuarios/crear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ nuevoUsuario, nuevaPassword, rol })
                });
                const data = await res.json();

                if (data.exito) {
                    resDiv.className = "mt-2 text-sm font-semibold text-green-600";
                    resDiv.innerText = data.mensaje;
                    document.getElementById('crearUsuarioForm').reset();
                } else {
                    resDiv.className = "mt-2 text-sm font-semibold text-red-600";
                    resDiv.innerText = data.error;
                }
            } catch (err) {
                resDiv.className = "mt-2 text-sm font-semibold text-red-600";
                resDiv.innerText = "Error de red al registrar usuario.";
            }
        });

        // Envío de ODS
        document.getElementById('odsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resDiv = document.getElementById('resultado');
            resDiv.classList.remove('hidden');
            resDiv.className = "mt-4 p-4 bg-gray-200 text-gray-800 rounded";
            resDiv.innerHTML = "Generando orden de servicio...";

            const formData = new FormData();
            formData.append('folioAcuerdo', document.getElementById('folioAcuerdo').value);
            formData.append('serialGo9', document.getElementById('serialGo9').value);
            formData.append('imeiCamara', document.getElementById('imeiCamara').value);
            formData.append('numeroSim', document.getElementById('numeroSim').value);
            formData.append('vinVehiculo', document.getElementById('vinVehiculo').value);

            ['foto_adherible', 'foto_imei_camara', 'foto_vin', 'foto_tablero', 'foto_arnes'].forEach(id => {
                const f = document.getElementById(id).files[0];
                if (f) formData.append(id, f);
            });

            try {
                const response = await fetch('/api/generar-ods', { method: 'POST', body: formData });
                const result = await response.json();

                if (result.exito) {
                    resDiv.className = "mt-4 p-4 bg-green-100 text-green-800 rounded";
                    resDiv.innerHTML = `<strong>¡Éxito!</strong> ${result.mensaje}<br><br><a href="${result.descargaUrl}" download class="bg-green-600 text-white px-4 py-2 rounded font-bold inline-block">Descargar ODS (.docx)</a>`;
                    if (localStorage.getItem('rol') === 'admin') cargarKPIs(localStorage.getItem('token'));
                } else {
                    resDiv.className = "mt-4 p-4 bg-red-100 text-red-800 rounded";
                    resDiv.innerHTML = `<strong>Error:</strong> ${result.error}`;
                }
            } catch (err) {
                resDiv.className = "mt-4 p-4 bg-red-100 text-red-800 rounded";
                resDiv.innerHTML = `<strong>Error de Red.</strong>`;
            }
        });
    </script>
</body>
</html>
